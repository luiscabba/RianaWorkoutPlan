<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build the Basics · Weekly Planner</title>
<meta name="description" content="A beginner 3-day strength split as an interactive weekly planner. Pick today and your session; the week fills itself.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#EEEEE6;
    --card:#FFFFFF;
    --ink:#17160F;
    --ink-soft:#5F5E54;
    --line:#DCDBD0;
    --line-strong:#C6C5B8;
    --volt:#C9E94B;
    --volt-deep:#8FAF16;
    --signal:#E8402A;
    --rest:#E6E5DB;
    --shadow:0 10px 26px -20px rgba(23,22,15,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--base);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:22px 20px 34px;
  }
  .app{max-width:1040px;margin:0 auto}

  /* ---------- TOP BAR ---------- */
  .topbar{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .wordmark{font-family:'Oswald',sans-serif;font-weight:700;font-size:24px;
    text-transform:uppercase;letter-spacing:.005em;line-height:1;white-space:nowrap}
  .wordmark .hl{background:var(--volt);padding:0 6px;box-shadow:0 0 0 3px var(--volt)}
  .tagline{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-soft)}

  /* ---------- CONTROLS ---------- */
  .controls{background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:14px 16px;display:flex;flex-wrap:wrap;gap:18px 26px;align-items:center;
    margin-bottom:16px;box-shadow:var(--shadow)}
  .ctrl-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ctrl-label{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft)}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--base)}
  .seg button{font-family:'Space Mono',monospace;font-weight:700;font-size:12px;
    letter-spacing:.05em;text-transform:uppercase;padding:8px 11px;border:0;
    background:transparent;color:var(--ink-soft);cursor:pointer;border-right:1px solid var(--line-strong);
    transition:background .15s,color .15s}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--base)}
  .seg.sessions button[aria-pressed="true"]{background:var(--volt);color:var(--ink)}
  .seg button:hover:not([aria-pressed="true"]){background:#fff;color:var(--ink)}

  /* ---------- WEEK GRID ---------- */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:16px}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:11px 10px 12px;text-align:left;cursor:pointer;min-height:118px;
    display:flex;flex-direction:column;gap:6px;position:relative;
    transition:border-color .15s,transform .12s,box-shadow .15s;font:inherit;color:inherit}
  .cell:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .cell .dow{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
  .cell .wk-num{font-family:'Space Mono',monospace;font-size:10px;color:var(--line-strong);
    position:absolute;top:11px;right:11px}
  .cell .ses{font-family:'Oswald',sans-serif;font-weight:600;font-size:17px;
    text-transform:uppercase;line-height:1.02;margin-top:auto}
  .cell .foc{font-size:11px;color:var(--ink-soft);line-height:1.3}
  .cell.train{border-left:5px solid var(--volt)}
  .cell.rest{background:var(--rest)}
  .cell.rest .ses{color:var(--ink-soft);font-weight:500}
  .cell.today .dow{color:var(--ink)}
  .today-pill{position:absolute;top:9px;right:9px;background:var(--ink);color:var(--base);
    font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.12em;
    padding:3px 6px;border-radius:3px}
  .cell.today .wk-num{display:none}
  .cell.viewing{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
  .cell.viewing.train{border-left-color:var(--volt)}

  /* ---------- DETAIL ---------- */
  .detail{background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:20px 22px;box-shadow:var(--shadow);min-height:300px}
  .d-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    padding-bottom:12px;border-bottom:1px solid var(--line)}
  .d-num{font-family:'Oswald',sans-serif;font-weight:700;font-size:30px;line-height:1;color:var(--volt-deep)}
  .d-name{font-family:'Oswald',sans-serif;font-weight:600;font-size:26px;text-transform:uppercase;line-height:1}
  .d-foc{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-soft);margin-left:auto}

  .ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 34px;margin-top:6px}
  @media (max-width:680px){.ex-grid{grid-template-columns:1fr}}
  .ex{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .ex .name{font-weight:600;font-size:14.5px;flex:1}
  .ex .tag{font-family:'Space Mono',monospace;font-weight:700;font-size:9px;letter-spacing:.08em;
    text-transform:uppercase;padding:2px 6px;border-radius:2px;border:1px solid var(--line);color:var(--ink-soft)}
  .ex.main .name{padding-left:9px;border-left:4px solid var(--volt);margin-left:-9px}
  .ex.main .tag{background:var(--volt);border-color:var(--volt);color:var(--ink)}
  .ex .scheme{font-family:'Space Mono',monospace;font-weight:700;font-size:13px;white-space:nowrap}

  /* rest detail */
  .rest-body{margin-top:10px}
  .rest-body p{max-width:60ch;color:var(--ink-soft);font-size:14.5px}
  .rest-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .rest-list span{background:var(--base);border:1px solid var(--line);border-radius:20px;
    padding:6px 13px;font-size:13px}

  /* rule strip */
  .rule-strip{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:18px}
  .rule-strip>div{background:var(--card);padding:9px 12px}
  .rule-strip .rn{font-family:'Oswald',sans-serif;font-weight:700;font-size:18px;line-height:1}
  .rule-strip .rt{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-soft);margin-top:3px}
  .rule-strip .lo .rn{color:var(--signal)}
  .rule-strip .zo{background:#17160F}
  .rule-strip .zo .rn{color:#fff}.rule-strip .zo .rt{color:var(--volt)}
  .rule-strip .hi .rn{color:var(--volt-deep)}

  footer{margin-top:20px;font-size:12px;color:var(--ink-soft);text-align:center;
    font-family:'Space Mono',monospace;letter-spacing:.04em}

  :focus-visible{outline:3px solid var(--volt-deep);outline-offset:2px}
  @media (max-width:560px){
    .week{grid-template-columns:1fr;gap:6px}
    .cell{min-height:0;flex-direction:row;align-items:center;gap:10px;padding:12px 14px}
    .cell .dow{order:1}
    .cell .ses{order:2;margin-top:0;margin-left:auto;font-size:16px}
    .cell .foc{display:none}
    .cell .wk-num{display:none}
    .cell .today-pill{order:3;position:static;top:auto;right:auto;margin-left:2px}
    .cell.train{border-left-width:6px}
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="wordmark">Build the <span class="hl">Basics</span></div>
    <div class="tagline">3-day strength split · beginner</div>
  </div>

  <div class="controls">
    <div class="ctrl-group">
      <span class="ctrl-label">Today is</span>
      <div class="seg days" id="daySeg" role="group" aria-label="Select today"></div>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">and I'm doing</span>
      <div class="seg sessions" id="sesSeg" role="group" aria-label="Select today's session"></div>
    </div>
  </div>

  <div class="week" id="week"></div>

  <div class="detail" id="detail"></div>

  <footer>General fitness guidance, not medical advice · Stop any movement that causes pain</footer>
</div>

<script>
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const ROT = ["A","P","S"];

const WORKOUTS = {
  A:{num:"01",name:"Anterior",focus:"Quads · Chest · Front delts",ex:[
    {name:"Goblet or Back Squat",scheme:"3 × 8–12",tag:"Main"},
    {name:"Dumbbell Bench Press",scheme:"3 × 8–12"},
    {name:"Leg Press",scheme:"3 × 8–12"},
    {name:"Leg Extension",scheme:"2–3 × 8–12",tag:"Acc"},
    {name:"Cable Fly / Incline DB Press",scheme:"2–3 × 8–12",tag:"Acc"},
    {name:"Plank",scheme:"2–3 × 30–45s",tag:"Core"},
  ]},
  P:{num:"02",name:"Posterior",focus:"Hamstrings · Glutes · Back",ex:[
    {name:"Deadlift — conv. or Romanian",scheme:"3 × 6–10",tag:"Main"},
    {name:"Lat Pulldown / Assisted Pull-up",scheme:"3 × 8–12"},
    {name:"Hip Thrust",scheme:"3 × 8–12"},
    {name:"Seated Hamstring Curl",scheme:"2–3 × 8–12",tag:"Acc"},
    {name:"Seated Cable Row / Face Pull",scheme:"2–3 × 10–15",tag:"Acc"},
    {name:"Back Extension",scheme:"2–3 × 12–15",tag:"Core"},
  ]},
  S:{num:"03",name:"Shoulders",focus:"Overhead press · Arms · Core",ex:[
    {name:"Overhead Press — DB or barbell",scheme:"3 × 8–12",tag:"Main"},
    {name:"Lat Pulldown / Assisted Pull-up",scheme:"3 × 8–12"},
    {name:"Lateral Raise",scheme:"2–3 × 12–15",tag:"Acc"},
    {name:"Bicep Curl + Tricep Pushdown",scheme:"2–3 × 10–12",tag:"Acc"},
    {name:"Hanging Knee Raise",scheme:"2–3 × 10–15",tag:"Core"},
    {name:"Cable Woodchop / Russian Twist",scheme:"2–3 × 12/side",tag:"Core"},
    {name:"Plank",scheme:"2–3 × 30–45s",tag:"Core"},
  ]},
};

// map JS getDay (Sun=0..Sat=6) to our Mon=0..Sun=6
const jsToMon = d => (d+6)%7;

let today = jsToMon(new Date().getDay());
let session = "A";
let viewing = today;

function schedule(){
  const out = Array(7).fill("rest");
  const base = ROT.indexOf(session);
  for(let i=0;i<7;i++){
    const diff = i - today;
    if(diff % 2 === 0){
      const step = diff/2;
      out[i] = ROT[((base+step)%3+3)%3];
    }
  }
  return out;
}

function buildControls(){
  const dSeg = document.getElementById("daySeg");
  dSeg.innerHTML = DOW.map((d,i)=>
    `<button data-day="${i}" aria-pressed="${i===today}">${d}</button>`).join("");
  const sSeg = document.getElementById("sesSeg");
  sSeg.innerHTML = ROT.map(k=>
    `<button data-ses="${k}" aria-pressed="${k===session}">${WORKOUTS[k].name}</button>`).join("");

  dSeg.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    today = +b.dataset.day; viewing = today; render();
  });
  sSeg.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    session = b.dataset.ses; viewing = today; render();
  });
}

function render(){
  document.querySelectorAll("#daySeg button").forEach(b=>
    b.setAttribute("aria-pressed", (+b.dataset.day===today)));
  document.querySelectorAll("#sesSeg button").forEach(b=>
    b.setAttribute("aria-pressed", (b.dataset.ses===session)));

  const sched = schedule();
  const week = document.getElementById("week");
  week.innerHTML = sched.map((code,i)=>{
    const isToday=i===today, isView=i===viewing;
    const cls=["cell", code==="rest"?"rest":"train", isToday?"today":"", isView?"viewing":""].join(" ");
    const badge = isToday
      ? `<span class="today-pill">Today</span>`
      : (WORKOUTS[code] ? `<span class="wk-num">Day ${WORKOUTS[code].num}</span>` : "");
    const label = code==="rest"?"Rest":WORKOUTS[code].name;
    const foc = code==="rest"?"Recovery":WORKOUTS[code].focus;
    return `<button class="${cls}" data-view="${i}">
      <span class="dow">${DOW[i]}</span>${badge}
      <span class="ses">${label}</span>
      <span class="foc">${foc}</span>
    </button>`;
  }).join("");
  week.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{viewing=+c.dataset.view;render();});

  renderDetail(sched[viewing]);
}

function renderDetail(code){
  const d = document.getElementById("detail");
  if(code==="rest"){
    d.innerHTML = `
      <div class="d-head">
        <span class="d-name">Recovery Day</span>
        <span class="d-foc">${DOW[viewing]} · Rest</span>
      </div>
      <div class="rest-body">
        <p>No lifting today. Recovery is when the strength actually gets built — give the compounds time to bounce back so the next session is stronger.</p>
        <div class="rest-list">
          <span>20–30 min easy walk</span>
          <span>Hip &amp; shoulder mobility</span>
          <span>Stretch tight areas</span>
          <span>Protein + hydrate</span>
          <span>Sleep 7–9 hrs</span>
        </div>
      </div>`;
    return;
  }
  const w = WORKOUTS[code];
  d.innerHTML = `
    <div class="d-head">
      <span class="d-num">${w.num}</span>
      <span class="d-name">${w.name}</span>
      <span class="d-foc">${DOW[viewing]} · ${w.focus}</span>
    </div>
    <div class="ex-grid">
      ${w.ex.map(e=>`
        <div class="ex ${e.tag==='Main'?'main':''}">
          <span class="name">${e.name}</span>
          ${e.tag?`<span class="tag">${e.tag}</span>`:""}
          <span class="scheme">${e.scheme}</span>
        </div>`).join("")}
    </div>
    <div class="rule-strip">
      <div class="lo"><div class="rn">≤6</div><div class="rt">Too heavy · lighten</div></div>
      <div class="zo"><div class="rn">8–12</div><div class="rt">Failure zone · 1 warm-up + 2 sets</div></div>
      <div class="hi"><div class="rn">15+</div><div class="rt">Too light · add weight</div></div>
    </div>`;
}

buildControls();
render();
</script>
</body>
</html>
